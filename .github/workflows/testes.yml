# ============================================================================
# OS TESTES CORREM NO GITHUB, NÃO NO COMPUTADOR DE QUEM DESENVOLVE.
#
# A suite completa são mais de mil testes e leva cerca de meia hora; a varredura
# dos ecrãs precisa de um browser (≈550 MB em disco) e de dois servidores de pé.
# Correr isso na máquina de trabalho ocupa-a durante esse tempo e gasta espaço —
# e o disco desta casa já esteve a 99%, ao ponto de o Windows recusar escritas e
# o sistema parecer ter um defeito de gravação que não tinha.
#
# Aqui corre nas máquinas do GitHub. O repositório é público, por isso não custa
# nada. A cada push para `main` fica dito, no separador Actions, se a casa está
# de pé — sem ninguém ter de se lembrar de correr nada.
#
# PORQUE É QUE ISTO NÃO SUBSTITUI CORRER OS TESTES ANTES DE ENVIAR: aqui o
# resultado chega DEPOIS do código já estar no repositório. Serve de rede de
# segurança e de memória — não de porteiro.
# ============================================================================
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # e sempre que se carregar no botão

jobs:
  backend:
    name: Suite do backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: As migrações estão todas escritas?
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          SQLITE_PATH: /tmp/ci.sqlite3
        # Um modelo alterado sem a migração respectiva passa nos testes (que
        # criam a base de raiz) e rebenta na instalação do cliente, que aplica
        # migrações sobre uma base que já existe. `--check` apanha isso aqui.
        run: python manage.py makemigrations --check --dry-run

      - name: Correr a suite
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          SQLITE_PATH: /tmp/ci.sqlite3
        run: python manage.py test -v 1

  frontend:
    name: Frontend (tipos, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        working-directory: frontend
        run: npm ci

      - name: Tipos
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Lint (zero erros; avisos passam)
        working-directory: frontend
        run: npm run lint

      - name: A aritmética do rodapé dos relatórios
        working-directory: frontend
        # Funções puras (unit/): não abrem browser nem precisam de servidores, e
        # correm em segundos. É o teste que prova que o ECRÃ não estraga o número
        # que o relatório manda — o servidor já tem os seus, mas a grelha
        # recalcula os totais e era aí que o rodapé mentia.
        run: npx playwright test --project=calculo

      - name: Build
        working-directory: frontend
        run: npx vite build

  concorrencia:
    name: As corridas, em PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PORQUE É QUE ESTE TRABALHO EXISTE À PARTE.
    #
    # Os testes de concorrência (core/test_concorrencia.py) perguntam o que
    # acontece quando duas pessoas fazem a mesma coisa ao mesmo tempo: dois
    # empregados a cobrar a mesma conta, duas recepções a dar o mesmo quarto,
    # dois armazéns a tirar a última garrafa. Em SQLite metade deles não se
    # consegue correr — a base deixa UM escritor de cada vez e recusa a segunda
    # escrita, e o teste salta a dizer isso em voz alta (skipTest) em vez de
    # fingir que passou.
    #
    # Em produção o cliente corre PostgreSQL, que deixa as duas entrar e é onde
    # a corrida existe de verdade. Instalar PostgreSQL na máquina de quem
    # desenvolve custa mais de 1 GB num disco que já esteve a 99%; aqui é um
    # contentor que o GitHub levanta e apaga, e não ocupa nada a ninguém.
    #
    # Corre a suite TODA em PostgreSQL, não só a concorrência: é a única vez em
    # que o código vê a base de dados com que o cliente trabalha, e um
    # comportamento diferente (uma ordenação, um tipo, uma transação) aparece
    # aqui em vez de aparecer na casa do cliente.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports: ['5432:5432']
        # Sem isto o trabalho começa antes de a base aceitar ligações.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr a suite em PostgreSQL
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          DB_ENGINE: postgresql
          DB_NAME: erp
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python manage.py test -v 1

  ecras:
    name: Os ecrãs, num browser a sério
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Só depois dos outros dois: se os tipos nem compilam, não vale a pena
    # levantar servidores para descobrir o mesmo mais devagar.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend && npm ci

      - name: Browser
        working-directory: frontend
        # `--with-deps` traz as bibliotecas de sistema que o Chromium precisa no
        # Linux. Só o chromium: os outros motores não servem nada aqui.
        run: npx playwright install --with-deps chromium

      - name: Montar uma casa a trabalhar
        env:
          DJANGO_DEBUG: 'True'
          SQLITE_PATH: /tmp/e2e.sqlite3
        working-directory: backend
        # A mesma sementeira que se usa à mão: hotel, ponto de venda, artigos,
        # caixa aberta, um quarto ocupado e um operador com PIN. Sem dados, a
        # varredura passa por estar tudo vazio e não por estar tudo bem.
        run: |
          python manage.py migrate --noinput
          python manage.py seed_accounting
          python manage.py shell -c "$(cat ../.github/workflows/semear_e2e.py)"

      - name: Levantar o sistema
        env:
          DJANGO_DEBUG: 'True'
          SQLITE_PATH: /tmp/e2e.sqlite3
        run: |
          cd backend && python manage.py runserver 8017 --noreload &
          cd frontend && VITE_API_URL=http://localhost:8017/api/ npx vite --port 5177 --strictPort &
          npx --yes wait-on http://localhost:5177 http://localhost:8017/api/pos/terminal/sectors/ -t 120000

      - name: Abrir os 160 ecrãs
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npx playwright test --project=ecras

      - name: Guardar o que ficou no ecrã quando falhou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-dos-ecras
          path: frontend/test-results/
          retention-days: 7
