# System Mwana Lodge — PCC — configuração nginx
# Copiar para /etc/nginx/sites-available/mwana-pcc e ligar com:
#   ln -s /etc/nginx/sites-available/mwana-pcc /etc/nginx/sites-enabled/
#
# Troque pcc.mwanalodge.ao pelo domínio real antes de correr o certbot.
#
# MODELO DE ACESSO (como o Oracle/Primavera que usa por OpenVPN): a consola do
# PCC (o ecrã que TU vês — login, Gestão de Clientes, Wizard, Admin do Django)
# só responde a quem está dentro da VPN (10.8.0.0/24, criada por setup-vpn.sh).
# A ÚNICA porta aberta ao público é o endpoint que as instalações dos clientes
# chamam sozinhas para sincronizar (licenses/latest/) — sem VPN nenhuma do lado
# deles, como já estava combinado.

server {
    listen 80;
    server_name pcc.mwanalodge.ao;
    # o certbot --nginx acrescenta aqui o bloco 443 e o redirecionamento sozinho
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pcc.mwanalodge.ao;

    ssl_certificate     /etc/letsencrypt/live/pcc.mwanalodge.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcc.mwanalodge.ao/privkey.pem;

    client_max_body_size 10M;   # logotipos e uploads pequenos — não é um servidor de ficheiros

    # ── A ÚNICA PORTA ABERTA AO PÚBLICO: a sincronização dos clientes ──
    # É esta chamada que "Sincronizar com o PCC" faz do servidor de cada hotel —
    # esses nunca estão na VPN, por isso este caminho fica de fora da restrição
    # abaixo. Continua a exigir prova de posse de uma licença assinada (é o
    # próprio LicenseSyncView que valida isso, não o nginx).
    location = /api/clm/licenses/latest/ {
        proxy_pass http://unix:/run/mwana-pcc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── TUDO O RESTO: só quem está na VPN ──
    # A consola (SPA + /admin/ + qualquer outro endpoint do clm) fica invisível
    # para a internet pública — quem não estiver ligado por OpenVPN Connect
    # recebe "connection refused", nem sequer vê o ecrã de login.
    location / {
        allow 10.8.0.0/24;    # sub-rede do OpenVPN (setup-vpn.sh)
        deny all;

        proxy_pass http://unix:/run/mwana-pcc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ESTÁTICOS servidos DIRETAMENTE por nginx (mais rápido que passar pelo Django/gunicorn)
    # — também só na VPN: são os do backoffice do PCC, ninguém de fora precisa deles.
    location /static/ { allow 10.8.0.0/24; deny all; alias /opt/mwana-pcc/dados/staticfiles/; expires 30d; }
    location /media/  { allow 10.8.0.0/24; deny all; alias /opt/mwana-pcc/dados/media/;       expires 7d; }
}
