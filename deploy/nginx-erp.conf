# System Mwana Lodge — ERP principal (backoffice + POS + API fiscal) — configuração nginx
#
# Diferente de deploy/pcc/nginx-pcc.conf: aquele é a consola do VENDEDOR, só acessível
# por VPN. ESTE é o ERP do HOTEL — é o que os terminais POS e o backoffice do cliente
# usam todos os dias, por isso fica aberto ao público (com HTTPS, não com VPN).
#
# Copiar para /etc/nginx/sites-available/mwana-erp e ligar com:
#   ln -s /etc/nginx/sites-available/mwana-erp /etc/nginx/sites-enabled/
#
# Troque erp.hotelx.ao pelo domínio real do cliente antes de correr o certbot, e
# /opt/mwana-erp pelo caminho real da instalação (BASE_DIR do backend).
#
# Atrás disto corre gunicorn (ver DEPLOYMENT.md §4):
#   gunicorn erp_server.wsgi:application --bind 127.0.0.1:8000 --workers 3
# (ou unix socket — trocar o proxy_pass abaixo por http://unix:/run/mwana-erp.sock;
#  se o gunicorn arrancar com --bind unix:/run/mwana-erp.sock)

server {
    listen 80;
    server_name erp.hotelx.ao;
    # o certbot --nginx acrescenta aqui o bloco 443 e o redirecionamento sozinho
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name erp.hotelx.ao;

    ssl_certificate     /etc/letsencrypt/live/erp.hotelx.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.hotelx.ao/privkey.pem;

    # SAF-T de um ano inteiro, imagens de artigos/logótipos, anexos de e-mail —
    # maior que o limite pequeno do PCC (que só recebe logótipos).
    client_max_body_size 25M;

    gzip on;
    gzip_types application/json application/javascript text/css text/xml application/xml;
    gzip_min_length 1024;

    # ── API (Django/gunicorn) ──
    # timeouts folgados: geração de SAF-T/relatórios grandes pode demorar mais que
    # os 60s por omissão do nginx — o Celery (erp_server/celery.py) tira o trabalho
    # pesado do pedido quando REDIS_URL está configurada, mas mesmo em modo síncrono
    # (instalação pequena) isto evita um 504 num hotel com muito movimento.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── ESTÁTICOS do Django (admin, DRF browsable API) ──
    location /static/ { alias /opt/mwana-erp/backend/staticfiles/; expires 30d; access_log off; }
    # ── UPLOADS (fotos de artigos, logótipos, anexos) ──
    location /media/  { alias /opt/mwana-erp/backend/media/;       expires 7d;  access_log off; }

    # ── FRONTEND (SPA React/Vite já compilado: `cd frontend && npm run build`) ──
    # try_files com fallback a index.html: rotas do lado do cliente (React Router)
    # não são pastas reais no disco — sem isto, um F5 em "/pos/config" dava 404.
    root /opt/mwana-erp/frontend/dist;
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # ficheiros com hash no nome (JS/CSS do build do Vite) podem ficar em cache eterna
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
